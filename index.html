<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasım & Kasımpatı</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="not-loaded">
    <div class="night"></div>
    
    <!-- Canvas tabakası çiçeklerin filizlenmesi için -->
    <canvas id="flowerCanvas"></canvas>

    <!-- Romantik Cam Not Kartı -->
    <div class="glass-card">
        <p class="note-line">"Ne ilk kasım, ne ilk kasımpatı.</p>
        <p class="note-line">Ne son kasımımız, ne de son kasımpatın."</p>
        <div class="signature">Melike <span class="heart">♥</span> Batuhan</div>
    </div>

    <!-- Alt Kontrol Paneli -->
    <div class="controls">
        <button id="sproutBtn">✨ Kasımpatılarını Filizlendir</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
